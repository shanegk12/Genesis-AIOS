# Build the morning-briefing image (context = repo root) and push it.
#   gcloud builds submit --config cloud/briefing.cloudbuild.yaml
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'cloud/briefing.Dockerfile', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/genesis-modularity/bez/morning-briefing:latest'
options:
  logging: CLOUD_LOGGING_ONLY
