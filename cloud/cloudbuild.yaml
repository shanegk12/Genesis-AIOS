# Build the Bez image from cloud/Dockerfile (context = repo root) and push it.
#   gcloud builds submit --config cloud/cloudbuild.yaml
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'cloud/Dockerfile', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/genesis-modularity/bez/bez:latest'
options:
  logging: CLOUD_LOGGING_ONLY
