<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What is Creationeering — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>What is Creationeering</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Engineering", "definition": "Using math and science to create physical solutions to real-world problems."}, {"term": "Creationeering™", "definition": "A framework that combines science, engineering, and entrepreneurship with biblical principles to explore God's creations."}, {"term": "Engineering Fields", "definition": "Different areas where engineers apply their skills and utilize systems to create solutions."}, {"term": "God's Creation", "definition": "The act of God bringing order and beauty to the world, creating everything from the sky and Earth to people in His image."}, {"term": "Our Divine Gift", "definition": "The ability God gave us to think, feel, innovate, and express our creativity, which allows us to shape the world."}, {"term": "Industrial and Systems Engineering", "definition": "An engineering field focused on improving complex processes, systems, or organizations."}, {"term": "Mechanical Engineering", "definition": "An engineering field that deals with the design, analysis, manufacturing, and maintenance of mechanical systems."}, {"term": "Computer Engineering", "definition": "An engineering field that integrates computer science and electrical engineering to develop computer hardware and software."}, {"term": "Electrical Engineering", "definition": "An engineering field that focuses on the study and application of electricity, electronics, and electromagnetism."}, {"term": "Stewardship", "definition": "Our responsibility to care for and manage God's creation, using our gifts to contribute to the world in a positive way."}, {"term": "Entrepreneurship", "definition": "The process of designing, launching, and running a new business, often involving innovation and risk-taking."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
