<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genesis and Creationeering — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Genesis and Creationeering</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Process", "definition": "A series of steps followed to reach a goal or solve a problem. Engineers use processes to take an idea and create something new."}, {"term": "Pattern Recognition", "definition": "Noticing repeated ideas, shapes, behaviors, or events that help us understand how something works. Engineers use this to identify problems and develop solutions."}, {"term": "Problem", "definition": "A need, challenge, or obstacle that requires a solution. Engineers are constantly looking for problems to solve."}, {"term": "Solution", "definition": "A design or plan that meets a need or solves a problem. Good solutions often create new challenges for engineers to tackle."}, {"term": "Nested Problem", "definition": "A problem which contains another problem. Both must be solved to get the proper solution, much like a set of Russian nesting dolls."}, {"term": "Creation Process", "definition": "The structured way God created the universe, which serves as a model for engineers in how to follow steps to achieve a purpose."}, {"term": "Engineering", "definition": "More than just building things, it's about following a structured process to solve problems, fulfill a purpose, and act as stewards of the world."}, {"term": "Biblical Worldview", "definition": "Applying principles from the Bible to how we design and approach engineering challenges, understanding our role as stewards."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
