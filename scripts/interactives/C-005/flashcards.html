<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Units, Conversions, and Measurement — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Units, Conversions, and Measurement</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Unit", "definition": "A known standard used to express and compare measurements, like a meter for length or a kilogram for mass."}, {"term": "Dimensional Analysis", "definition": "A problem-solving method that uses the manipulation of units to check or perform calculations, helping you convert between different units."}, {"term": "Accuracy", "definition": "How close a measurement is to the true or accepted value. Think about hitting the bullseye on a target."}, {"term": "Precision", "definition": "The consistency or repeatability of a set of measurements. This is like hitting the same spot on a target multiple times, even if it's not the bullseye."}, {"term": "Conversion Factor", "definition": "A ratio (fraction) used to change a measurement from one unit to another, such as '1 meter / 100 centimeters'."}, {"term": "Why are units important for communication?", "definition": "Units help us communicate clearly by giving context to numbers, so everyone understands exactly what quantity is being discussed."}, {"term": "Why are units important for calculations?", "definition": "Using the correct units ensures that our calculations are accurate when solving engineering problems and manipulating measurements."}, {"term": "What can happen if units are mixed up?", "definition": "Mixing up units can lead to incorrect results and serious errors in engineering projects, like using inches instead of centimeters."}, {"term": "Metric System", "definition": "A system of measurement used widely around the world, known for its base-10 structure and units like meters, grams, and liters."}, {"term": "Imperial System", "definition": "A system of measurement primarily used in the United States, which includes units like feet, pounds, and gallons."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
