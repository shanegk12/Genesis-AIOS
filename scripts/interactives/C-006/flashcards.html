<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intro to Systems Thinking — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Intro to Systems Thinking</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "System", "definition": "A group of parts working together to perform a specific function or task."}, {"term": "Subsystem", "definition": "A smaller system that exists and operates as part of a larger, more complex system."}, {"term": "Input", "definition": "What goes into a system to make it function, such as energy, information, or materials."}, {"term": "Output", "definition": "What comes out of a system as a result of its actions, like movement, heat, light, or a finished product."}, {"term": "Process", "definition": "A series of steps or actions used to transform inputs into outputs, creating or improving something."}, {"term": "Why do engineers use structured processes?", "definition": "Engineers use structured processes to design and refine systems effectively, ensuring they meet their intended purpose."}, {"term": "How does a bicycle demonstrate a system?", "definition": "A bicycle is a system because its parts (like pedals, chain, wheels) work together to achieve the goal of forward movement."}, {"term": "What are common forms of inputs?", "definition": "Common forms of inputs include energy, information, and materials, which are necessary for a system to begin its process."}, {"term": "What is the purpose of understanding inputs and outputs?", "definition": "Understanding inputs and outputs helps us see how systems function and how different elements are transformed within them."}, {"term": "How do processes relate to systems?", "definition": "Processes are the steps or actions that describe how inputs are transformed into outputs, keeping systems alive and functioning."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
