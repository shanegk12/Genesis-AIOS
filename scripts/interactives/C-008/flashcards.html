<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ethics in Engineering — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Ethics in Engineering</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Creationeering", "definition": "A philosophy that combines engineering with ethical stewardship, emphasizing the responsibility to honor and care for God's creation."}, {"term": "Stewardship", "definition": "The duty to protect and manage the resources of the planet, a key principle in Creationeering."}, {"term": "Ethics", "definition": "Moral principles that guide a person's behavior or conduct, especially important in engineering decisions."}, {"term": "NSPE Code of Ethics", "definition": "A set of rules developed by the National Society of Professional Engineers to guide ethical behavior in the engineering profession."}, {"term": "Ethical Decision-Making (in Engineering)", "definition": "Making choices in engineering that consider the impact on safety, hazardous materials, efficiency, and user experience, prioritizing the well-being of people and communities."}, {"term": "Role of Ethics in Design", "definition": "Considering safety, hazardous materials, and user experience during the design process to ensure the well-being of individuals and communities."}, {"term": "Biblical Concept of Stewardship", "definition": "The idea that mankind was given the first calling to be caretakers and have dominion over what God created."}, {"term": "Professional Responsibility of Engineers", "definition": "The duty of engineers to act ethically, guided by principles like the NSPE Code of Ethics and Biblical stewardship, to be 'salt and light' in their work."}, {"term": "Why in Engineering", "definition": "Understanding not just how things work, but also why they happen or need to happen in a certain way, encompassing both scientific and ethical reasons."}, {"term": "Impact of Engineering Choices", "definition": "The effects that engineers' decisions have on people, communities, and the environment, emphasizing the need for ethical consideration."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
