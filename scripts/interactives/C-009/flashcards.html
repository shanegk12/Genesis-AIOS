<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Understanding Process Mapping and Flowcharts — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Understanding Process Mapping and Flowcharts</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Process Mapping", "definition": "The engineering skill of outlining processes using images or visual aids to understand, analyze, and improve systems."}, {"term": "Flowchart", "definition": "A diagram that uses various symbols (blocks) to visually represent the steps and decisions in a process."}, {"term": "Input", "definition": "Anything that is put into a system, such as materials, data, or money, to begin a process."}, {"term": "Process", "definition": "The actual operation being performed within a system, where work is done on an input to produce an output."}, {"term": "Output", "definition": "The result or product generated by a system after the process has been completed."}, {"term": "Block", "definition": "The term for each step in a flowchart, where the shape of the block symbolizes the action being performed."}, {"term": "Decision Block", "definition": "A diamond-shaped flowchart symbol that indicates a point where a choice must be made, often a Yes/No question."}, {"term": "Start/End Block", "definition": "An oval-shaped flowchart symbol that marks the beginning or end of a process."}, {"term": "Process Block", "definition": "A rectangular flowchart symbol representing a step where an action or task is performed."}, {"term": "Input/Output Block", "definition": "A parallelogram-shaped flowchart symbol used to show where data or materials are entered into or exit the process."}, {"term": "Connectors", "definition": "Arrows in a flowchart that show the direction and flow of the process from one step to the next."}, {"term": "Algorithms", "definition": "A set of step-by-step instructions or rules used to solve a problem or complete a task, similar to a process map."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
