<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design: Forces and Influences — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Design: Forces and Influences</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "What is a Force?", "definition": "A push or pull on an object that can change its motion. It's an interaction that causes an object with mass to change its velocity."}, {"term": "What unit is used to measure force?", "definition": "Forces are measured in Newtons (N), named after Sir Isaac Newton. One Newton is roughly the force of gravity on a medium-sized apple."}, {"term": "What is the foundational equation for force?", "definition": "The foundational equation is F = ma, where F is force, m is mass, and a is acceleration. This equation shows how force, mass, and acceleration are related."}, {"term": "What does 'F = ma' mean in simple terms?", "definition": "It means that to get more force, you either need more mass or more acceleration. A larger push or pull is needed for heavier objects or to make something speed up faster."}, {"term": "Gravity", "definition": "The force that pulls objects toward Earth. It's what makes things fall down."}, {"term": "Normal Force", "definition": "The support force exerted by a surface on an object resting on it. It pushes back against gravity or other forces pressing down."}, {"term": "Friction", "definition": "A force that resists motion between two surfaces that are touching. It's what makes things slow down or stop sliding."}, {"term": "Spring Force", "definition": "A force created when a spring is stretched or compressed. It tries to return the spring to its original shape."}, {"term": "Applied Force", "definition": "A force that is intentionally exerted on an object, like when you push a door or kick a ball."}, {"term": "Acceleration", "definition": "A change in an object's motion, which can mean speeding up, slowing down, or changing direction."}, {"term": "How do engineers use forces in design?", "definition": "Engineers understand and apply principles of force (F=ma) to design safe and effective systems, like rockets, bridges, and vehicles."}, {"term": "How does the Falcon 9 rocket demonstrate F=ma?", "definition": "As the rocket burns fuel, its mass (m) decreases. Since the engine force (F) stays constant, the rocket's acceleration (a) dramatically increases, pushing it into space."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
