<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form, Function, and Aesthetic — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Form, Function, and Aesthetic</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Form", "definition": "The physical shape, structure, and configuration of an object, including its dimensions and materials."}, {"term": "Function", "definition": "The primary purpose or problem the design is intended to solve; what the object is supposed to do."}, {"term": "Aesthetics", "definition": "The study of beauty and psychological appeal; how a product looks, feels, and sounds."}, {"term": "User Experience (UX)", "definition": "How people interact with a product, encompassing how easy it is to use and their emotional response to it."}, {"term": "Function Dictates Form", "definition": "The golden rule that an object's shape and structure should be determined by its intended purpose or what it needs to do."}, {"term": "Subassembly", "definition": "A smaller unit of parts that performs a specific task within a larger, more complex system."}, {"term": "Biomimicry", "definition": "The practice of copying or imitating nature's designs and functions to solve human problems."}, {"term": "Trinity of Design", "definition": "The three pillars of successful engineering design: Form, Function, and Aesthetics, which must be balanced."}, {"term": "Creationeering", "definition": "A concept that explores how design principles like Form, Function, and Aesthetics are seen in both human inventions and the natural world."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
