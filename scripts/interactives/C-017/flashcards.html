<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novelty and Innovation in Engineering — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Novelty and Innovation in Engineering</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Invention", "definition": "The creation of a product or introduction of a process for the very first time; it's the birth of a new idea into a physical or digital form."}, {"term": "Innovation", "definition": "Improving upon an existing invention or making a significant contribution to an existing product, process, or service, focusing on value and utility."}, {"term": "Novelty", "definition": "The quality of being new or original, essential for an idea to be considered an innovation and different enough from existing solutions."}, {"term": "Prior Art", "definition": "All existing knowledge, inventions, and publications that came before a new idea, which engineers study to ensure their ideas are truly original."}, {"term": "Originality", "definition": "The quality of being unique and not derived from anything else, crucial for an invention or innovation to be distinct and potentially patentable."}, {"term": "Invention Focus", "definition": "The main goal of an invention is to create something entirely new, focusing on discovery and technical feasibility."}, {"term": "Innovation Focus", "definition": "The main goal of innovation is to improve something that already exists, focusing on efficiency, value, and user experience."}, {"term": "Invention Requirement", "definition": "For an invention, the key requirement is a 'first of its kind' idea, something that has never existed before."}, {"term": "Innovation Requirement", "definition": "For an innovation, the key requirement is novelty combined with utility, meaning it must be new and also useful."}, {"term": "Invention Risk", "definition": "The primary risk with an invention is high technical risk, questioning whether the new idea will actually work."}, {"term": "Innovation Risk", "definition": "The primary risk with an innovation is high market risk, questioning whether people will actually use or want the improved product."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
