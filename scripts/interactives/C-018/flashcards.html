<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept Generation — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Concept Generation</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Concept Generation", "definition": "The process engineers use to create many new ideas for a design, often using structured methods."}, {"term": "Brainstorming", "definition": "Generating many ideas without judging them at first, to explore all possibilities."}, {"term": "SCAMPER", "definition": "A structured brainstorming method that uses seven prompts (Substitute, Combine, Adapt, Modify, Put to another use, Eliminate, Reverse) to help generate new ideas."}, {"term": "Morph Chart", "definition": "A table used in brainstorming that mixes and matches different design features to create new and unique ideas."}, {"term": "Tradeoff", "definition": "A decision where improving one feature of a design means another feature must be reduced or sacrificed."}, {"term": "Criteria", "definition": "The specific requirements or standards that a design must meet to be considered successful."}, {"term": "OCV Method", "definition": "A method used to guide brainstorming and decision-making by filtering ideas through Objectives, Constraints, and Variables."}, {"term": "Functional Fixedness", "definition": "A mental block that prevents people from seeing new ways to use objects or solve problems, often by only seeing their traditional function."}, {"term": "Biblical Principles in Engineering", "definition": "Applying God-given creativity, wisdom, and discernment to guide engineering decisions and stewardship."}, {"term": "Why brainstorm?", "definition": "Brainstorming helps engineers avoid getting stuck on their first idea and allows them to explore many different solutions at any stage of a project."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
