<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Importance of Data in Engineering — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>The Importance of Data in Engineering</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Objective Data", "definition": "Facts that are not influenced by personal feelings or opinions, providing a clear and unbiased view of information."}, {"term": "Verifiable", "definition": "Something that can be tested and proven true by others using the same methods, ensuring reliability and accuracy."}, {"term": "Validation", "definition": "The process of confirming that a design or solution meets its intended requirements and functions correctly, often through testing and data analysis."}, {"term": "Stewardship", "definition": "The responsible management and protection of resources, including materials, finances, and human lives, entrusted to engineers."}, {"term": "Why is data important in engineering?", "definition": "Data is essential for engineers to make informed decisions, validate designs, and ensure safety and effectiveness, rather than relying on guesses."}, {"term": "Objective vs. Subjective Information", "definition": "Objective information is fact-based and verifiable, while subjective information is based on personal opinions or feelings."}, {"term": "Measurable Evidence", "definition": "Data provides the numbers and facts needed to evaluate whether a design works, like how much weight a beam can support."}, {"term": "Repeatable Tests", "definition": "Engineers conduct experiments multiple times to ensure consistent results, which helps validate their design decisions and build confidence."}, {"term": "What is the 'language of truth' in the physical world?", "definition": "Data is considered the 'language of truth' because it provides the evidence needed to make reliable decisions in engineering."}, {"term": "How does data relate to safety?", "definition": "Data helps engineers make decisions that keep people safe by providing evidence that designs will work as intended and withstand various conditions."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
