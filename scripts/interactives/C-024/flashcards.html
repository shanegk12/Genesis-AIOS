<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modeling Reality: Physical vs. Computational — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Modeling Reality: Physical vs. Computational</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Physical Model", "definition": "A tangible, real-world representation of a system, often built to scale for testing purposes."}, {"term": "Computational Model", "definition": "A digital or mathematical simulation used to predict how a design will perform without building a physical object."}, {"term": "Simulation", "definition": "The process of running a computational model to observe how a system behaves under different conditions or over time."}, {"term": "Validation", "definition": "The critical process of checking if the results from a computational model accurately match the results from a physical model or real-world data."}, {"term": "Ground Truth", "definition": "Objective data collected from a real-world physical system, used to verify the accuracy of computational models."}, {"term": "Finite Element Analysis (FEA)", "definition": "A technical method used in computational modeling to predict stress and forces inside an object, helping engineers understand its strength."}, {"term": "Factor of Safety (FS)", "definition": "A mathematical ratio that indicates how much stronger a design is than it technically needs to be to prevent failure, ensuring public safety."}, {"term": "Model", "definition": "A working representation of reality that engineers use to predict how a design will perform, test its limits, and ensure efficiency."}, {"term": "Tradeoff", "definition": "The central tension in design where engineers must make a compromise between competing requirements, such as strength, weight, and cost."}, {"term": "Integrity", "definition": "In engineering, it means designing with honesty and ensuring that solutions are reliable and built on verifiable truth, reflecting biblical principles."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
