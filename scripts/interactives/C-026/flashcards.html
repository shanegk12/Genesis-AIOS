<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What is Synthesis? — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>What is Synthesis?</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Analysis", "definition": "The process of breaking down a complex system or idea into its smaller, simpler parts to understand how it works."}, {"term": "Synthesis", "definition": "The process of combining separate elements or ideas to form a coherent whole, often leading to a new understanding, design, or solution."}, {"term": "What is the relationship between Analysis and Synthesis?", "definition": "Analysis helps us understand how something works by looking at its pieces, while synthesis is about building something new by bringing those pieces together."}, {"term": "Creationeering™", "definition": "A framework that integrates engineering principles with a biblical worldview, guiding the design and development of solutions for God's creation."}, {"term": "What is the 'Analysis & Synthesis' phase in Creationeering™?", "definition": "This phase involves both breaking down complex information to understand it (analysis) and combining ideas to create new solutions (synthesis)."}, {"term": "Multiscale Modeling", "definition": "A scientific approach that connects observations and phenomena at different size or time scales, from atomic to macroscopic."}, {"term": "How does Multiscale Modeling help with synthesis?", "definition": "It helps in synthesizing understanding by connecting atomic-level causes to macro-level observations, showing how small parts contribute to the big picture."}, {"term": "Objective", "definition": "The specific goal or purpose that a design or solution aims to achieve."}, {"term": "What is the OCV method?", "definition": "The Objective, Constraint, Variable (OCV) method is used to synthesize potential solutions for a design challenge by defining goals, limitations, and changeable factors."}, {"term": "Stewardship in Creationeering™", "definition": "Recognizing the biblical call to responsibly manage and care for God's creation as we synthesize new solutions and technologies."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
