<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stress and Strain — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Stress and Strain</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Stress (σ)", "definition": "The internal resistance a material develops when an external force is applied, calculated by dividing the force by the area it acts upon."}, {"term": "Strain (ε)", "definition": "The deformation of a material in response to an external force, measured as the change in length divided by its original length."}, {"term": "Tensile Stress", "definition": "A type of stress that occurs when a material is pulled apart or stretched."}, {"term": "Compressive Stress", "definition": "A type of stress that occurs when a material is squeezed or pushed together."}, {"term": "Shear Stress", "definition": "A type of stress caused by forces acting parallel to a surface, making layers slide past each other."}, {"term": "Young’s Modulus (E)", "definition": "A measure of a material's stiffness, found by the slope of the elastic region on a stress-strain curve."}, {"term": "Yield Point", "definition": "The point on the stress-strain curve where a material begins to permanently deform and will not return to its original shape."}, {"term": "Ultimate Tensile Strength (UTS)", "definition": "The maximum stress a material can withstand before it starts to break or fracture."}, {"term": "Pareto Frontier", "definition": "The set of optimal design choices that balances competing goals, like making something strong but also lightweight."}, {"term": "Hierarchical Multiscale Modeling (HM²)", "definition": "A Creationeering technique that connects information from the smallest atomic level to how a whole system performs."}, {"term": "Objective-Constraint-Variable (OCV) Method", "definition": "A method used to optimize designs by clearly defining what you want to achieve, what limits you have, and what you can change."}, {"term": "Stress-Strain Curve", "definition": "A graph that shows how a material responds to increasing stress by deforming, revealing important properties like stiffness and strength."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
