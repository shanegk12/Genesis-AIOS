<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What is Procurement? — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>What is Procurement?</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Procurement", "definition": "The entire process of getting the materials, components, and services you need from an outside source to build your projects."}, {"term": "What is the main goal of procurement?", "definition": "To wisely acquire the right materials, components, and services needed to bring your designs to life."}, {"term": "Supplier", "definition": "An individual or company that provides goods or services. They are also called a vendor."}, {"term": "Quotation", "definition": "A formal statement from a supplier that tells you the cost of specific goods or services, usually for a limited time."}, {"term": "Purchase Order", "definition": "A legal document from a buyer to a seller that lists the types, quantities, and agreed prices for products or services, authorizing the purchase."}, {"term": "What influences procurement decisions?", "definition": "Factors like quality (how good it is), cost (how much it costs), and timeliness (how quickly it arrives) influence these decisions."}, {"term": "OCV Method", "definition": "A method used to make informed choices during procurement by considering Objectives, Constraints, and Variables."}, {"term": "Why is procurement important in Creationeering™?", "definition": "It ensures your projects are built on a solid foundation by making smart, responsible choices about the parts you use."}, {"term": "How does procurement connect to biblical principles?", "definition": "It connects to the biblical principle of wise stewardship, meaning we should carefully manage the resources God has given us."}, {"term": "What is the first step in a procurement cycle?", "definition": "Identifying the specific needs for your project, such as what materials or services are required."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
