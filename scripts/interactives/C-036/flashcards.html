<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Specifications — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Technical Specifications</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Technical Specifications", "definition": "Detailed documents that describe the exact requirements for a product, material, or service, ensuring we get the right 'stuff' for our projects."}, {"term": "Procurement", "definition": "The process of obtaining or buying goods and services, like gathering all your ingredients before baking a cake."}, {"term": "Multiscale Modeling", "definition": "A scientific approach that connects observations at large scales (like a whole bridge) to events at very small scales (like the atoms in its steel)."}, {"term": "Objective", "definition": "The desired outcome or goal for a system or component, like wanting your bridge to be strong enough to hold cars."}, {"term": "Constraint", "definition": "A limitation or restriction that must be satisfied in a design or process, such as a budget limit or a specific size requirement."}, {"term": "Variable", "definition": "A parameter that can be changed or adjusted in a design, like choosing different types of wood for a project."}, {"term": "Optimization", "definition": "The process of finding the best possible solution to a problem, often by balancing different goals and limits."}, {"term": "Material Properties", "definition": "Characteristics of a material, such as how strong, heavy, or good at conducting electricity it is, which determine how it behaves."}, {"term": "OCV Method", "definition": "A method using Objectives, Constraints, and Variables to help optimize material selection based on technical specifications."}, {"term": "Stewardship (in Creationeering™)", "definition": "The biblical principle of wisely using and caring for God's creation and resources, which includes careful planning in engineering projects."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
