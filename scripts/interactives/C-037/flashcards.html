<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fabrication — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Fabrication</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Fabrication", "definition": "The process of making individual parts or products from raw materials using different techniques, like shaping metal or molding plastic."}, {"term": "Assembly", "definition": "The phase in Creationeering™ where all the individual fabricated parts are put together to build a complete product or system."}, {"term": "Technical Specifications", "definition": "Detailed instructions that define what a component or system needs to do, how it should look, and what materials it should be made from."}, {"term": "Creationeering™", "definition": "The overall process of understanding God's design and our role as co-creators and stewards in engineering."}, {"term": "Additive Manufacturing", "definition": "A fabrication method where material is added layer by layer to create a three-dimensional object, commonly known as 3D printing."}, {"term": "Importance of Fabrication", "definition": "Fabrication is important because you need to make all the individual parts before you can assemble them into a complete machine or product."}, {"term": "Multiscale Modeling", "definition": "Connecting observations of fabricated parts (macro-level) to what's happening at the atomic level to understand why they behave a certain way."}, {"term": "OCV Method", "definition": "A method used to optimize a fabrication process by considering the Objective (what you want to achieve), Constraints (limitations), and Variables (things you can change)."}, {"term": "Stewardship in Fabrication", "definition": "Responsible fabrication practices honor God's creation by using resources wisely and minimizing waste."}, {"term": "Raw Materials", "definition": "The basic substances, like metal, plastic, or wood, from which components and products are made during fabrication."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
