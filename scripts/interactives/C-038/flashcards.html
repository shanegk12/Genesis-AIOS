<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hazards and Operations — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Hazards and Operations</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Hazard", "definition": "A potential source of harm or danger that could happen during the assembly process."}, {"term": "Operation", "definition": "A specific action or task that needs to be performed as part of putting something together."}, {"term": "Risk", "definition": "The chance that a hazard will occur and how bad its impact would be if it did."}, {"term": "Mitigation", "definition": "Actions you take to reduce how likely a risk is to happen or how severe its effects would be."}, {"term": "Ergonomics", "definition": "The study of how people interact with their workspace to make it more comfortable, efficient, and safe."}, {"term": "Tolerance", "definition": "The small amount of allowable variation in the size or property of a part, ensuring it still fits correctly."}, {"term": "Interference Fit", "definition": "When two parts are designed to be slightly larger than each other, so you need force to push them together tightly."}, {"term": "Clearance Fit", "definition": "When two parts are designed with a small gap between them, allowing them to slide together easily without force."}, {"term": "Multiscale Modeling", "definition": "Observing something at a large level (like a whole product) and then understanding what causes it at a much smaller level (like individual atoms)."}, {"term": "Stewardship", "definition": "The responsible overseeing and protection of something valuable, like taking good care of God's creation."}, {"term": "Assembly Phase", "definition": "The stage in Creationeering™ where all the individual components are put together to form a complete product."}, {"term": "OCV Method", "definition": "A method used to identify and reduce risks during the assembly process, ensuring safety and success."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
