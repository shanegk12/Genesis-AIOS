<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resource Management and Loss Prevention — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Resource Management and Loss Prevention</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Resource Management", "definition": "Wisely using and controlling materials, time, energy, and effort in a project to make the most of what God has given us."}, {"term": "Loss Prevention", "definition": "Methods and actions used to stop materials, time, or tools from being wasted, damaged, or stolen during a project."}, {"term": "Efficiency", "definition": "Getting the most useful work done with the least amount of effort or resources used."}, {"term": "Optimization", "definition": "Making something work as well as possible, often by finding the best way to balance different needs or factors."}, {"term": "Assembly Phase", "definition": "The stage in Creationeering where plans are turned into real, working creations, and all the pieces are put together."}, {"term": "Stewardship", "definition": "Responsibly managing and taking care of the resources and gifts God has entrusted to us."}, {"term": "Sources of Resource Loss", "definition": "Things like dropped parts, wasted materials, or rushed steps that can cause a project to lose resources."}, {"term": "Biblical Call to Stewardship", "definition": "The idea that we are called by God to be responsible and careful with the resources He provides, connecting faith with wise engineering."}, {"term": "Why is Resource Management important?", "definition": "It helps us make the most of what we have, prevents waste, and ensures our projects are successful and efficient."}, {"term": "How does this lesson connect to the Assembly phase?", "definition": "During Assembly, plans become real, and managing resources carefully prevents costly mistakes and keeps the project on track."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
