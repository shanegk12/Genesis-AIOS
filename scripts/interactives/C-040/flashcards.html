<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precision Measurement and Tolerances — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Precision Measurement and Tolerances</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Precision", "definition": "How close multiple measurements are to each other, showing consistency in your measuring."}, {"term": "Accuracy", "definition": "How close a measurement is to the true, correct value of what you are measuring."}, {"term": "Tolerance", "definition": "The allowable amount of variation or wiggle room in the size or shape of a part."}, {"term": "Dimension", "definition": "A measurable extent of something, like its length, width, or height."}, {"term": "Calipers", "definition": "A measuring tool used to find the exact external and internal sizes of objects with high accuracy."}, {"term": "Micrometer", "definition": "A very precise measuring tool used to measure tiny distances or thicknesses, often smaller than what calipers can measure."}, {"term": "Nominal Value", "definition": "The intended or target size of a part before any manufacturing variations happen."}, {"term": "Clearance Fit", "definition": "When two parts are designed to fit together with a small gap, allowing them to move freely."}, {"term": "Interference Fit", "definition": "When two parts are designed to overlap and require force to be pushed together, creating a tight, secure connection."}, {"term": "Multiscale Modeling", "definition": "Observing a system at different levels, from what you can easily see down to the tiny atomic level, to understand how it works."}, {"term": "Why Precision Matters", "definition": "Even tiny differences, like a few extra layers of atoms, can prevent parts from fitting or working correctly, as seen in a grinding clock gear."}, {"term": "Assembly Phase", "definition": "The stage in Creationeering where all the planned and prepared parts are put together to build the final creation."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
