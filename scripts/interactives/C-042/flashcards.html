<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline Development and Milestones — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Timeline Development and Milestones</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Logistics", "definition": "The careful planning, organization, and execution of moving things and information from one point to another in a project."}, {"term": "Timeline", "definition": "A roadmap for your project that shows you exactly where you are going and when you expect to arrive at important checkpoints."}, {"term": "Milestone", "definition": "A critical checkpoint along a project timeline that marks significant progress or the completion of a major phase."}, {"term": "Timeline Development", "definition": "The process of creating a detailed schedule for a project, outlining tasks, durations, and dependencies."}, {"term": "Creationeering", "definition": "The overarching theme of the curriculum, likely referring to engineering projects inspired by the act of creation."}, {"term": "Logistics Phase", "definition": "The stage in Creationeering where detailed planning, organization, and resource management for a project take place."}, {"term": "Project Timeline Importance", "definition": "Timelines are important because they help projects stay on track, ensure resources are available when needed, and guide creations from idea to reality."}, {"term": "Progress Tracking", "definition": "Using milestones to monitor how a project is advancing and to see if it is meeting its planned schedule."}, {"term": "Multiscale Modeling", "definition": "A principle used to understand how project delays or accelerations might happen at different levels of detail."}, {"term": "Objective, Constraint, Variable (OCV) Method", "definition": "A method used to optimize a project timeline by considering the project's goals, limitations, and changeable factors."}, {"term": "Stewardship of Time and Resources", "definition": "The responsible and careful management of the time and materials available for a project."}, {"term": "Preliminary Timeline", "definition": "An initial, draft version of a project timeline that outlines the basic steps and expected durations."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
