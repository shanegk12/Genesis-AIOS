<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning and Buffer Time — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Planning and Buffer Time</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Planning", "definition": "The process of thinking about and organizing the activities needed to reach a specific goal in an engineering project."}, {"term": "Buffer Time", "definition": "Extra time added to a project schedule to prepare for unexpected delays, problems, or changes that might come up."}, {"term": "Timeline", "definition": "A visual chart that shows all project tasks in order, along with their start and end dates, helping you see the project's flow."}, {"term": "Logistics", "definition": "The detailed organization and management of resources, like moving and supplying materials and people, to get a complex project done."}, {"term": "Contingency", "definition": "A possible future event or situation that you can't be sure will happen, but you should still plan for."}, {"term": "Critical Path", "definition": "The specific sequence of tasks in a project that determines the absolute earliest time the entire project can be finished."}, {"term": "Milestone", "definition": "A significant point or important stage in a project, often marking the completion of a major part or delivery."}, {"term": "Resource Allocation", "definition": "The process of deciding how to assign and manage available resources, such as time, money, people, and materials, to different tasks."}, {"term": "Optimization", "definition": "The process of making something as effective or functional as possible, often by finding the best balance between different factors."}, {"term": "Constraints", "definition": "The limits or restrictions on a project, such as a strict deadline or a fixed budget, that you must work within."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
