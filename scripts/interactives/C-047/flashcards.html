<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory and Warehouse Management — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Inventory and Warehouse Management</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Inventory", "definition": "The complete list of items, goods, or materials a business or organization has in stock, ready to be used or sold."}, {"term": "Warehouse", "definition": "A large building specifically designed for safely storing goods, materials, or products until they are needed or shipped out."}, {"term": "Logistics", "definition": "The detailed planning and management of how resources, like materials and information, are moved, stored, and flow from one point to another."}, {"term": "Inventory Management", "definition": "The process of tracking, ordering, storing, and using a company's inventory to ensure there's enough stock without having too much or too little."}, {"term": "Warehouse Management", "definition": "The process of organizing and controlling all operations within a warehouse, including receiving, storing, moving, and shipping goods efficiently."}, {"term": "Overstock", "definition": "Having too much inventory on hand, which can lead to higher storage costs, wasted space, and products potentially expiring or becoming outdated."}, {"term": "Throughput", "definition": "The rate at which items or materials can be processed, moved, or produced through a system, like a factory or a warehouse."}, {"term": "Raw Materials", "definition": "The basic ingredients or unprocessed substances used to create a finished product, like lumber for a chair or cotton for a shirt."}, {"term": "Work-in-Process (WIP)", "definition": "Goods that are currently being manufactured or assembled but are not yet finished products, like a car on an assembly line that's not fully built."}, {"term": "Multiscale Modeling", "definition": "An engineering approach that connects and understands how things work at different levels, from tiny atoms to large systems, to solve complex problems."}, {"term": "Optimization", "definition": "The process of finding the very best possible solution or outcome for a problem, given certain limitations or requirements."}, {"term": "OCV Method", "definition": "A structured problem-solving approach used in engineering to identify the Objective (goal), Constraints (limitations), and Variables (things that can change) in a design challenge."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
