<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What is Assembly? — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>What is Assembly?</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Assembly", "definition": "The process of putting individual components together to create a subsystem, and then combining subsystems to make a complete, functional system."}, {"term": "Subsystem", "definition": "A major functional part that contributes to a larger system, like the braking system on a bicycle."}, {"term": "Component", "definition": "An individual, distinct part that makes up a subsystem or a larger system, such as a single screw or a gear."}, {"term": "Tolerance", "definition": "The acceptable amount of variation in the size, shape, or other properties of a part, ensuring it still fits and functions correctly."}, {"term": "Interface", "definition": "The specific point or surface where two different components meet and interact with each other."}, {"term": "Integrate", "definition": "To combine different parts or elements together to form a unified and complete whole."}, {"term": "Multiscale Modeling", "definition": "A method used to understand a system by connecting what we see at a large scale to the tiny details and causes at a microscopic or atomic level."}, {"term": "Optimization", "definition": "The process of finding the best possible solution or design for a project, considering all the goals and limitations."}, {"term": "Dominion Mandate", "definition": "God's instruction to humanity to responsibly manage and care for His creation, using our engineering skills for good."}, {"term": "System", "definition": "A group of elements that work together according to specific rules to form a unified and purposeful whole."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
