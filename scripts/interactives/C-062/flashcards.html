<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Experimental Design and Testing Protocols — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Experimental Design and Testing Protocols</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Experimental Design", "definition": "A systematic plan for conducting experiments to answer specific questions and collect reliable information about your creations."}, {"term": "Testing Protocols", "definition": "Detailed, step-by-step instructions that explain exactly how an experiment will be performed to make sure it's done consistently and accurately every time."}, {"term": "Independent Variable", "definition": "The one thing you intentionally change or manipulate in an experiment to see what effect it has on your design."}, {"term": "Dependent Variable", "definition": "The factor you measure or observe in an experiment; it's the outcome that changes because of what you did to the independent variable."}, {"term": "Control Group", "definition": "A part of an experiment that doesn't get the special treatment or change, used as a baseline to compare against the groups that do."}, {"term": "Optimization", "definition": "The process of finding the very best solution or compromise for your design, especially when you have several different things you want it to do."}, {"term": "Reproducibility", "definition": "The ability for someone else to repeat your experiment and get similar results, showing your findings are reliable."}, {"term": "OCV Method", "definition": "A helpful tool for designing and analyzing your experiments by clearly defining your Objective (what you want to achieve), Constraints (what limits you), and Variables (what you're changing and measuring)."}, {"term": "Creationeering™ Performance Phase", "definition": "The stage in the Creationeering™ process where you evaluate how well your designs work and identify ways to make them even better."}, {"term": "Meticulous Testing", "definition": "Carefully and thoroughly testing your designs to ensure they are well-made and function as intended, reflecting good stewardship."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
