<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Continuous Improvement — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Continuous Improvement</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Continuous Improvement", "definition": "An ongoing effort to make products, services, or processes better and more efficient over time, just like God refines His creation."}, {"term": "System", "definition": "A group of parts that work together to form a whole, like the different components of a water pump or a computer."}, {"term": "Efficiency", "definition": "Doing something well without wasting time, effort, or resources. It's about getting the most out of what you have."}, {"term": "Effectiveness", "definition": "How well something achieves its goal or desired result. It's about whether you're doing the right thing."}, {"term": "Feedback Loop", "definition": "A process where the results of a system are used to adjust and improve how the system works in the future."}, {"term": "Baseline", "definition": "A starting point or standard measurement that you use to compare future performance and see if improvements are being made."}, {"term": "Optimization", "definition": "The process of finding the best possible way to do something, making it as good as it can be within certain limits."}, {"term": "Root Cause Analysis", "definition": "A systematic way to find the real, underlying reasons why a problem is happening, not just the obvious symptoms."}, {"term": "Throughput", "definition": "The rate at which a system can process things or complete tasks, like how many gallons a pump can move per minute."}, {"term": "Constraint", "definition": "A limit or restriction that affects how you can design something or complete a process, like a budget or available power source."}, {"term": "Multiscale Modeling", "definition": "Looking at a problem from different levels, from big observations down to tiny details, to understand its causes."}, {"term": "Creationeering™ Performance Phase", "definition": "The stage in the Creationeering™ framework where engineers focus on making their designs and systems work better through continuous improvement."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
