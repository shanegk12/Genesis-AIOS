<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data-Defined Performance — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Data-Defined Performance</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Data-Defined Performance", "definition": "Measuring and evaluating how well a system or product works using objective information, rather than just guessing."}, {"term": "Key Performance Indicator (KPI)", "definition": "A measurable value that shows how effectively a system or company is reaching its main goals."}, {"term": "Efficiency", "definition": "The ratio of useful work done compared to the total energy used. It's about getting the most out of what you put in."}, {"term": "Throughput", "definition": "The rate at which something can be processed or produced. How much can it handle in a certain amount of time?"}, {"term": "Reliability", "definition": "The chance that a system or part will work correctly without failing for a specific time under specific conditions."}, {"term": "Optimization", "definition": "The process of finding the best possible solution or outcome while working within certain limits."}, {"term": "Multiscale Modeling", "definition": "A scientific method that links what we observe at large scales to the smaller, often atomic, reasons behind them."}, {"term": "Objective (OCV)", "definition": "The desired goal or outcome you want to achieve with your design or optimization problem."}, {"term": "Constraint (OCV)", "definition": "A limitation or restriction that must be followed when designing or optimizing something."}, {"term": "Variable (OCV)", "definition": "A factor or characteristic that can be changed or adjusted during a design or optimization process."}, {"term": "Creationeering™ Performance Phase", "definition": "The stage where we understand how well our creations are doing by using real data to make smart decisions."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
