<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Optimization Techniques and Trade-Offs — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Optimization Techniques and Trade-Offs</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Optimization", "definition": "The process of making something as good or as effective as possible, finding the best solution among many options."}, {"term": "Trade-off", "definition": "A situation where you have to give up one thing to gain another, involving a compromise or exchange."}, {"term": "Objective", "definition": "The specific goal or aim you are trying to achieve with your design, such as what you want to maximize or minimize."}, {"term": "Constraint", "definition": "A limitation or restriction that your design must meet, like available materials, budget, or size limits."}, {"term": "Efficiency", "definition": "A measure of how well a system uses its resources (like energy or materials) to produce a desired output with less waste."}, {"term": "Performance", "definition": "How well a system or design achieves its intended function and meets its goals."}, {"term": "OCV Method", "definition": "A framework used in optimization that stands for Objective, Constraint, and Variable, helping to define an optimization problem."}, {"term": "Multiscale Modeling", "definition": "A way to understand how something works by connecting observations from a large scale to very tiny, atomic details."}, {"term": "Stewardship", "definition": "The responsible management and care of resources, connecting to biblical principles of honoring God's design."}, {"term": "Variables", "definition": "The aspects of your design that you can change or adjust to try and improve its performance."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
