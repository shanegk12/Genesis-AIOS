<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Functional Requirements and Specifications — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Functional Requirements and Specifications</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Functional Requirement", "definition": "What a system absolutely must do to achieve its main purpose. It describes a specific action or behavior."}, {"term": "Specification", "definition": "A detailed, measurable description of a requirement. It gives exact rules for how well something needs to work to be considered successful."}, {"term": "Non-Functional Requirement", "definition": "How a system must be, focusing on qualities like how fast it runs, how reliable it is, or how secure it is."}, {"term": "Performance", "definition": "How well a system does its job. This is often measured by things like speed, how efficient it is, or how much it produces."}, {"term": "Tolerance", "definition": "The acceptable amount of difference allowed for a specific measurement or feature. It's the wiggle room."}, {"term": "Verification", "definition": "The process of checking if a system meets all the detailed rules and measurements we set for it."}, {"term": "Validation", "definition": "The process of checking if a system actually solves the real problems and meets the true needs of the people who will use it."}, {"term": "Objective (OCV)", "definition": "The ultimate goal or desired outcome you are trying to achieve with your design project."}, {"term": "Constraint (OCV)", "definition": "A limitation or restriction that you must consider when designing, such as budget, size, or available time."}, {"term": "Variable (OCV)", "definition": "An aspect of your design that you can change or adjust to help meet your goals while staying within your limitations."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
