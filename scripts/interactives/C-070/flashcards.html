<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Acceptance and Final Delivery — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Customer Acceptance and Final Delivery</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Customer Acceptance", "definition": "The process of making sure a product or service truly meets what the person using it needs and expects."}, {"term": "Final Delivery", "definition": "The very last step where a finished product is transported and given to the customer."}, {"term": "Performance (Creationeering™ Phase)", "definition": "The stage where an engineered system works exactly as it was designed to, doing what it's supposed to do."}, {"term": "User Feedback", "definition": "Information given by customers about their experience with a product, which helps make it better."}, {"term": "Iterative Design", "definition": "A design process where you repeat steps like designing, testing, and making changes based on what you learn."}, {"term": "Multiscale Modeling", "definition": "A way to understand how something works by connecting what you see on a large scale to what's happening at a tiny, atomic level."}, {"term": "Optimization", "definition": "The process of finding the best possible solution or outcome, often by balancing different goals."}, {"term": "Logistics", "definition": "The detailed planning and organization of a complex operation, especially moving things from one place to another."}, {"term": "Creationeering™", "definition": "Genesis K-12 Academy's term for the process of engineering, emphasizing our role as stewards of God's creation."}, {"term": "OCV Method", "definition": "A method used to solve challenges by identifying the Objectives, Constraints, and Variables involved."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
