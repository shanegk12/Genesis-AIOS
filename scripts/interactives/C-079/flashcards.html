<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Durability — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Durability</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Durability", "definition": "The ability of a product or material to withstand wear, pressure, or damage over time, making it last longer."}, {"term": "Sustainability (Creationeering™ Phase)", "definition": "The phase in Creationeering™ where we make sure engineered systems can continue to exist and use resources even after they are built and finished."}, {"term": "Material Properties", "definition": "The special characteristics of a material, like how strong or bendy it is, that tell us how it will act when forces are applied."}, {"term": "Atomic Scale", "definition": "The super tiny level of individual atoms and molecules, which are the basic building blocks of everything around us."}, {"term": "Macroscopic", "definition": "Something that is large enough to be seen and observed with our eyes, without needing a microscope."}, {"term": "Stress", "definition": "An internal force within a material that happens when outside forces push or pull on it."}, {"term": "Strain", "definition": "The change in shape or deformation of a material that occurs because of stress."}, {"term": "Fatigue", "definition": "When a material gets weaker over time because it has been repeatedly pushed or pulled on."}, {"term": "Corrosion", "definition": "The slow wearing away or destruction of materials, especially metals, due to chemical reactions with their surroundings."}, {"term": "Optimization", "definition": "The process of finding the very best balance between different design choices to get the desired result, like making something super durable."}, {"term": "Stewardship (Biblical Principle)", "definition": "The biblical idea of responsibly managing and taking care of the resources and creations God has given us, including making durable products."}, {"term": "Romans 1:20 (NKJV)", "definition": "This Bible verse teaches us that we can understand God's power and nature by looking at the amazing things He created in the world."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
