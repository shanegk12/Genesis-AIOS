<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Ethics of End-of-Life (EOL) Responsibility — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>The Ethics of End-of-Life (EOL) Responsibility</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Creationeering™", "definition": "A way of thinking about engineering and business that combines technology with biblical principles for creating new things."}, {"term": "Death & Recycling", "definition": "The final stage in Creationeering™ where a product's materials are either thrown away or turned into new products."}, {"term": "End-of-Life (EOL)", "definition": "The point when a product can no longer be used for its original purpose because it's broken or worn out."}, {"term": "Stewardship", "definition": "Taking responsible care of something valuable that has been entrusted to you, like God's creation."}, {"term": "Multiscale Modeling", "definition": "Connecting what we see happening to materials at a large size (like a cracked skateboard deck) to what's happening at a tiny, atomic level."}, {"term": "Objective (OCV)", "definition": "A desired goal or outcome you want to achieve when designing something, like making a product last longer."}, {"term": "Constraint (OCV)", "definition": "A rule or limit that must be followed when designing something, such as a budget or specific material requirements."}, {"term": "Variable (OCV)", "definition": "Something a designer can change or control in a design, like the type of plastic used in a product."}, {"term": "Recycling", "definition": "Turning an old product or material into something new and useful, instead of throwing it away."}, {"term": "Reprocessing", "definition": "Treating materials in a new way so they can be used again or recycled into other products."}, {"term": "End-of-Life Responsibility", "definition": "The ethical duty engineers and companies have to consider what happens to products after they are no longer useful."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
