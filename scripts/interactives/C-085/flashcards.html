<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legislation and Global E-Waste Policy — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Legislation and Global E-Waste Policy</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Creationeering™ Death & Recycling Phase", "definition": "This is the final phase of the Creationeering™ framework, focusing on what happens when a product reaches the end of its functional life, including responsible disposal and recycling."}, {"term": "E-waste", "definition": "This term refers to all the electronic devices and components that are discarded or thrown away, such as old phones, computers, and televisions."}, {"term": "Legislation", "definition": "These are laws created by a government or law-making body to guide how people and organizations should act, like laws about recycling e-waste."}, {"term": "Policy", "definition": "These are plans or rules adopted by a government, company, or individual to guide decisions and actions, such as a policy for responsible e-waste management."}, {"term": "Biblical Stewardship", "definition": "This is the idea, rooted in the Bible, that humans are called by God to care for and responsibly manage His creation, including our resources and the environment."}, {"term": "Recycling", "definition": "This is the process of taking old or waste materials and turning them into new products, like turning old plastic bottles into new ones."}, {"term": "Sustainability", "definition": "This concept means meeting our current needs without harming the ability of future generations to meet their own needs, ensuring resources last for a long time."}, {"term": "Circular Economy", "definition": "This is an economic system designed to eliminate waste and keep resources in use for as long as possible, rather than throwing them away after one use."}, {"term": "Dominion Mandate", "definition": "This is the biblical command given to humanity to care for, manage, and have authority over God's creation, emphasizing our responsibility to the Earth."}, {"term": "John 6:12 and E-waste", "definition": "Jesus' command to 'gather up the leftover fragments, that nothing may be lost' teaches us to value resources and avoid waste, a principle that applies to managing e-waste responsibly."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
