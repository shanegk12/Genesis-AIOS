<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototypes — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Prototypes</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Prototyping", "definition": "The process of building early versions of a product or system to test and refine its design."}, {"term": "Iterative Design", "definition": "A repetitive process of testing and refining a design, making small changes and improvements each time."}, {"term": "Mousetrap Mark 1.0", "definition": "The first, basic version of the mousetrap car built to establish a starting point for performance and build confidence."}, {"term": "Baseline Foundation", "definition": "The initial performance data collected from the Mark 1.0 car, which serves as a comparison point for future improvements."}, {"term": "Mousetrap Mark 1.1", "definition": "The second version of the mousetrap car where students begin to experiment with changing one part at a time to see its effect."}, {"term": "One Factor At A Time (OFAT)", "definition": "A method used to test improvements by changing only one variable at a time while keeping everything else the same."}, {"term": "Mousetrap Mark 2.0", "definition": "The third physical prototype of the mousetrap car, used for final testing and design improvements before computer analysis."}, {"term": "Mousetrap Mark 3.0 Computational Design", "definition": "The final version of the design, which is optimized and validated using computer analysis and modeling, without building a physical car."}, {"term": "Iteration", "definition": "The repetitive process of testing and refining a system, making small changes to improve it over time."}, {"term": "Variable", "definition": "Something that can be changed or adjusted in an experiment, like the lever arm or wheels on a mousetrap car."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
