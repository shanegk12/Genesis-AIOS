<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Communicating Designs and Testing — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Communicating Designs and Testing</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Technical Sketching", "definition": "A specialized language used in engineering to communicate complex ideas and designs through precise drawings, acting as a blueprint for what will be built."}, {"term": "Why is technical sketching important?", "definition": "It's the universal language of engineering, allowing engineers to clearly communicate designs, visualize complex ideas, and ensure accurate construction."}, {"term": "Sketches (in engineering)", "definition": "Informal, freehand drawings used for quick idea generation and visualizing concepts during the early stages of design."}, {"term": "Drafting", "definition": "Formal, scale drawings that provide clear and precise manufacturing instructions, including geometry, dimensions, and material specifications."}, {"term": "What is the purpose of engineering drawings?", "definition": "They provide explicit, clear, and concise information to ensure uniform understanding among everyone involved in a project, from designer to manufacturer."}, {"term": "How do sketches help engineers?", "definition": "They help ideas take form on paper, allow visualization of complex assemblies, and act as an extension of short-term memory during rapid ideation."}, {"term": "What information do engineering drawings include?", "definition": "They include geometry, dimensions, and material specifications to ensure precise construction and understanding."}, {"term": "What is a 'legal record' in engineering drawings?", "definition": "Both sketches and formal drawings serve as a permanent record of the design, important for quality control, maintenance, and protecting intellectual property."}, {"term": "Mousetrap Car Mark 2 Design", "definition": "The final iteration of your mousetrap car design, which requires a detailed, drafted sketch accounting for all dimensions and tolerances before building."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
