<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build 2: Iterative Design - Mark21 — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Build 2: Iterative Design - Mark21</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Little Moe (Mark 1)", "definition": "The initial prototype vehicle built to establish a baseline for how a simple system converts potential energy into motion."}, {"term": "Genesis 0:0", "definition": "A concept representing intentional thinking and foundational analysis in the engineering design process."}, {"term": "Synthesis", "definition": "The critical phase where individual, validated findings are integrated to create a superior, optimized whole, as defined by Dr. Mark Horstemeyer."}, {"term": "Mark 2", "definition": "The refined and optimized version of the Little Moe vehicle, built by applying lessons learned from the Mark 1 data."}, {"term": "One-Factor-at-a-Time (OFAT)", "definition": "A strategy used in the Little Moe phase to isolate and analyze the impact of individual design variables."}, {"term": "Success Patterns", "definition": "The positive outcomes or effective design choices identified from isolating and testing individual variables."}, {"term": "OCV Framework", "definition": "A framework for redefining Objectives, Constraints, and Variables based on data collected from the Mark 1 phase."}, {"term": "Subassembly Optimization", "definition": "The process of ensuring each individual part or section of the vehicle is designed and built with precision to contribute to the overall system's performance."}, {"term": "Atomic-Level Precision", "definition": "Refers to the meticulous attention to detail and accuracy required for every small component, like polishing axles to reduce friction."}, {"term": "Inertia", "definition": "The resistance of an object to any change in its state of motion, which can steal energy if a vehicle's frame is too heavy."}, {"term": "Axle Binding", "definition": "Occurs when the vehicle's frame is too light or flexible, causing the rails to bend and interfere with the smooth rotation of the axles."}, {"term": "Coefficient of Friction", "definition": "A measure of the resistance to motion between two surfaces in contact, which can be reduced by polishing axles."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
