<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modeling Resistive Forces — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Modeling Resistive Forces</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Resistive Forces", "definition": "Forces that oppose the motion of an object, like friction and air resistance, acting as 'hidden thieves' of energy."}, {"term": "Free Body Diagram (FBD)", "definition": "A graphical illustration that visualizes all the forces acting on an object, helping engineers 'see' and calculate their impact."}, {"term": "Friction", "definition": "A resistive force that occurs when two surfaces rub against each other, opposing motion."}, {"term": "Air Resistance (Drag)", "definition": "A resistive force caused by air pushing against a moving object, slowing it down."}, {"term": "Computer-Aided Design (CAD)", "definition": "Software used to create digital models of designs, allowing engineers to simulate performance before building physical prototypes."}, {"term": "Computational Modeling", "definition": "Using computers to simulate and predict how a design will perform in the real world, minimizing waste and speeding up development."}, {"term": "Rapid Iteration", "definition": "The process of quickly testing, analyzing, and refining a design based on feedback, often using digital tools like CAD."}, {"term": "Digital Twin", "definition": "A virtual model of a physical object that behaves identically, used for testing and predicting performance without building a physical version."}, {"term": "Isolate the Body (FBD Step)", "definition": "The first step in creating an FBD, where you draw a simplified version of the object separate from its environment."}, {"term": "Define the Coordinate System (FBD Step)", "definition": "The second step in creating an FBD, where you indicate positive directions for X (forward) and Y (up) to help with force calculations."}, {"term": "Truth and Integrity (Biblical Principle)", "definition": "A biblical principle applied to design, emphasizing honesty and careful stewardship in predicting and presenting a design's performance."}, {"term": "Vectors (in FBDs)", "definition": "Arrows used in Free Body Diagrams to represent forces, showing both their direction and magnitude."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
