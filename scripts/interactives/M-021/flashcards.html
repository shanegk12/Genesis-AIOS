<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instrumentation and Data Types — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Instrumentation and Data Types</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Performance Evaluation", "definition": "The Seventh Pillar of Creationeering, which involves using data to determine how well an engineering solution is working."}, {"term": "Data", "definition": "The language of the physical world, used to translate physical movement into digital knowledge for performance evaluation."}, {"term": "Sensors and Instrumentation", "definition": "Tools that allow engineers to translate physical movement into digital knowledge by measuring what our biological senses cannot perceive."}, {"term": "Instrumentation", "definition": "The field of engineering that creates 'digital eyes and ears' to measure physical phenomena beyond human perception."}, {"term": "Echolocation", "definition": "A method used by bats (and some sensors) to determine distance by emitting sound waves and measuring the time it takes for the echo to return."}, {"term": "HC-SR04 Ultrasonic Sensor", "definition": "A sensor in your lab kit that functions like a bat's ears, allowing your vehicle to 'see' its environment using sound waves."}, {"term": "Transduction", "definition": "The fundamental process in every sensor where energy is converted from one form to another, such as physical movement into an electrical signal."}, {"term": "Input/Output (I/O) Logic", "definition": "The system that connects physical sensors to digital microcontrollers, allowing data to be read and processed."}, {"term": "Integers", "definition": "A fundamental computer programming data type used for whole numbers (without decimal points)."}, {"term": "Floats", "definition": "A fundamental computer programming data type used for numbers that have decimal points."}, {"term": "Booleans", "definition": "A fundamental computer programming data type that represents a true or false value."}, {"term": "Strings", "definition": "A fundamental computer programming data type used for sequences of characters, like words or sentences."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
