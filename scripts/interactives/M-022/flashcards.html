<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Engineering Report Structure — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>The Engineering Report Structure</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Engineering Design Report (EDR)", "definition": "The most important deliverable in professional engineering, serving as a 'map' of the creative process and documenting a design's success as a 'repeatable scientific fact'."}, {"term": "Creationeering™ Framework", "definition": "An approach that emphasizes bringing order to the design process, reflecting the belief that 'God is not a God of confusion but of peace'."}, {"term": "Integrity (in EDR)", "definition": "Being truthful in technical documentation, even when recording failures, as an act of honesty and faithfulness."}, {"term": "Stewardship (in EDR)", "definition": "A record of how well an engineer managed the time, talent, and resources entrusted to them during the design process."}, {"term": "Introduction (EDR component)", "definition": "The section of the EDR where the problem, background, and goals of the engineering project are presented to the reader."}, {"term": "Excellence (in EDR)", "definition": "A quality reflected in a report that is clear, easy for teammates to follow, and justifies design decisions with reliable data."}, {"term": "Ground Truth Data", "definition": "Real-world, empirical data collected during experiments or tests, used to justify design decisions in an EDR."}, {"term": "Flaw (in Creationeering)", "definition": "In the Creationeering lab, a 'flaw' is reinterpreted as a 'finding', encouraging engineers to learn from mistakes and iterate."}, {"term": "Pareto Frontier", "definition": "The set of optimal choices where a design, like the mousetrap car, is as efficient as the laws of physics allow, representing peak performance."}, {"term": "Junior Creationeer Mandate", "definition": "The responsibility of a student to demonstrate leadership through their EDR, proving they have moved from thinking to making to optimizing."}, {"term": "One-Factor-at-a-Time (OFAT)", "definition": "A method used to isolate variables in experiments, allowing engineers to test the effect of one change at a time."}, {"term": "Mark 2 Vehicle", "definition": "The high-performance vehicle developed by students after building the 'Little Moe' prototype and refining their design."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
