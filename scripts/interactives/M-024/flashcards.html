<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analysis Gate Review — Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;padding:20px;color:#222}
h1{text-align:center;color:#1B2A5C;font-size:1.1rem;margin-bottom:16px}
.deck{max-width:600px;margin:0 auto}
.card-wrap{perspective:900px;margin-bottom:14px}
.card{position:relative;height:130px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;
  justify-content:center;padding:18px;text-align:center;backface-visibility:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.front{background:#1B2A5C;color:#fff;font-weight:600;font-size:.95rem}
.back{background:#fff;color:#1B2A5C;transform:rotateY(180deg);font-size:.88rem;line-height:1.5}
.hint{text-align:center;color:#888;font-size:.75rem;margin-bottom:12px}
</style>
</head>
<body>
<h1>Analysis Gate Review</h1>
<p class="hint">Tap a card to flip it</p>
<div class="deck" id="deck"></div>
<script>
const cards = [{"term": "Analysis Gate Review", "definition": "A formal checkpoint in engineering where data is presented to experts to prove a design is safe, efficient, and ready to move to the next phase."}, {"term": "Goal of the Analysis Gate", "definition": "To verify that mathematical models match physical findings, closing the gap between assumptions and data-driven proof."}, {"term": "Analysis Phase (Creationeering)", "definition": "The act of breaking a complex system into its smallest parts to understand how each piece works."}, {"term": "OCV Method", "definition": "A technical tool used to root every design decision in Objectives, Constraints, and Variables."}, {"term": "Objective (OCV Method)", "definition": "The specific goal or purpose of your design or what you are trying to achieve."}, {"term": "HM² (Hierarchical Multiscale Modeling)", "definition": "A method to understand how data at the atomic level affects the entire system, like seeing tiny cracks in a bridge's steel."}, {"term": "Data Validation", "definition": "The process of checking if computer models or mathematical predictions match real-world results from experiments."}, {"term": "Integrity (Creationeering)", "definition": "The foundational principle of the Creationeering mind, emphasizing honesty and accuracy in data and design."}, {"term": "Stewardship (Engineering)", "definition": "The responsible management and protection of resources, time, and safety entrusted to engineers."}, {"term": "Little Moe Prototype", "definition": "The initial design or model of the mousetrap car that Junior Creationeers started with."}];
const deck = document.getElementById('deck');
cards.forEach(c => {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.innerHTML = `<div class="card"><div class="front">${c.term}</div><div class="back">${c.definition}</div></div>`;
  wrap.querySelector('.card').addEventListener('click', e => e.currentTarget.classList.toggle('flipped'));
  deck.appendChild(wrap);
});
</script>
</body>
</html>
