<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f7f9fc;
          padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h2 { color: #1e3a5f; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.06em;
       margin-bottom: 18px; border-bottom: 2px solid #c9a227; padding-bottom: 6px; }
  .counter { font-size: 0.82rem; color: #64748b; margin-bottom: 14px; }
  .scene { width: 100%; max-width: 520px; height: 200px; perspective: 1000px; cursor: pointer; }
  .card  { width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 0.45s ease; }
  .card.flipped { transform: rotateY(180deg); }
  .face  { position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 14px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .front { background: #1e3a5f; color: #fff; box-shadow: 0 4px 16px rgba(30,58,95,0.25); }
  .back  { background: #c9a227; color: #1e3a5f; transform: rotateY(180deg);
            box-shadow: 0 4px 16px rgba(201,162,39,0.3); }
  .face-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
                 opacity: 0.6; margin-bottom: 10px; }
  .face-text  { font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
  .back .face-text { font-size: 0.95rem; font-weight: 400; }
  .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 12px; }
  .nav { display: flex; gap: 12px; margin-top: 18px; align-items: center; }
  .btn { background: #1e3a5f; color: #fff; border: none; border-radius: 8px;
          padding: 10px 22px; font-size: 0.88rem; font-weight: 600;
          cursor: pointer; transition: background 0.15s; }
  .btn:hover { background: #152b47; }
  .btn:disabled { background: #cbd5e1; cursor: default; }
  .progress { display: flex; gap: 5px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #dde3ee; transition: background 0.2s; }
  .dot.seen { background: #c9a227; }
  .dot.current { background: #1e3a5f; }
</style>
</head>
<body>
<h2>Vocabulary Flashcards</h2>
<div class="counter" id="counter"></div>
<div class="scene" onclick="flip()">
  <div class="card" id="card">
    <div class="face front">
      <div class="face-label">Term</div>
      <div class="face-text" id="front-text"></div>
    </div>
    <div class="face back">
      <div class="face-label">Definition</div>
      <div class="face-text" id="back-text"></div>
    </div>
  </div>
</div>
<div class="hint" id="hint">Click card to reveal definition</div>
<div class="nav">
  <button class="btn" id="prev-btn" onclick="go(-1)">&#8592; Prev</button>
  <button class="btn" id="next-btn" onclick="go(1)">Next &#8594;</button>
</div>
<div class="progress" id="progress"></div>
<script>
const cards = [{"term": "Customer Persona", "def": "A detailed, semi-fictional representation of your ideal customer, based on market research and real data about your existing customers. It helps you understand their needs, goals, and behaviors."}, {"term": "Performance", "def": "In Creationeering, this refers to how well an engineered system functions according to its designed purpose throughout its life cycle, considering both normal and abnormal environments."}, {"term": "Marketing Standards", "def": "The principles and guidelines used to communicate the value, features, and benefits of a product or service to its target audience in a consistent and ethical manner."}, {"term": "Metrics", "def": "Quantifiable measures used to track and assess the status of a specific process or outcome. For a mousetrap car, this could be speed, distance, durability, or aesthetics."}, {"term": "Value Proposition", "def": "A statement that describes the unique benefits your product offers to a specific customer segment, explaining why they should choose your product over alternatives."}, {"term": "Stewardship", "def": "The responsible overseeing and protection of something considered worth caring for and preserving. In a biblical context, it refers to managing God-given resources and talents for His glory and the good of others."}, {"term": "Multiscale Modeling", "def": "An engineering approach that connects observations at one length scale (e.g., macro-level car performance) to causes at another length scale (e.g., atomic-level material properties)."}, {"term": "OCV Method", "def": "A design framework that identifies the Objective (what you want to achieve), Constraints (limitations or requirements), and Variables (elements you can change) to optimize a design solution."}];
let cur = 0, flipped = false, seen = new Set();

function render() {
  const c = cards[cur];
  document.getElementById('front-text').textContent = c.term;
  document.getElementById('back-text').textContent  = c.def;
  document.getElementById('counter').textContent    = `Card ${cur + 1} of ${cards.length}`;
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === cards.length - 1;
  document.getElementById('hint').textContent = flipped ? 'Click to flip back' : 'Click card to reveal definition';
  renderDots();
}

function renderDots() {
  const p = document.getElementById('progress');
  p.innerHTML = cards.map((_, i) => {
    let cls = 'dot';
    if (i === cur) cls += ' current';
    else if (seen.has(i)) cls += ' seen';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function flip() {
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
  if (flipped) seen.add(cur);
  document.getElementById('hint').textContent = flipped ? 'Click to flip back' : 'Click card to reveal definition';
  renderDots();
}

function go(dir) {
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  cur = Math.max(0, Math.min(cards.length - 1, cur + dir));
  render();
}

render();
</script>
</body>
</html>
