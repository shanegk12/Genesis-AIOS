<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mousetrap Assembly Blueprint</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f7f9fc;
    color: #1e3a5f;
    padding: 20px;
    min-height: 100vh;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(30,58,95,0.15);
    overflow: hidden;
  }
  header {
    background: #1e3a5f;
    color: #ffffff;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.3em; }
  .badge {
    background: #c9a227;
    color: #1e3a5f;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 0.9em;
  }
  .stage { padding: 24px; }
  .progress-bar {
    height: 8px;
    background: #f7f9fc;
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #c9a227;
    transition: width 0.4s;
  }
  .step-title {
    font-size: 1.1em;
    color: #1e3a5f;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .step-prompt {
    color: #555;
    margin-bottom: 18px;
    font-size: 0.95em;
  }
  .workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 650px) {
    .workspace { grid-template-columns: 1fr; }
  }
  .panel {
    background: #f7f9fc;
    border: 2px solid #e0e6ee;
    border-radius: 10px;
    padding: 14px;
    min-height: 220px;
  }
  .panel h3 {
    font-size: 0.95em;
    color: #1e3a5f;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #c9a227;
  }
  .draggable {
    background: #ffffff;
    border: 2px solid #1e3a5f;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: grab;
    font-size: 0.9em;
    transition: all 0.2s;
    user-select: none;
  }
  .draggable:hover { transform: translateX(3px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .draggable.dragging { opacity: 0.5; }
  .drop-slot {
    background: #ffffff;
    border: 2px dashed #b0b8c5;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9em;
  }
  .drop-slot.over { border-color: #c9a227; background: #fffbe8; }
  .slot-num {
    background: #1e3a5f;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 0.85em;
    flex-shrink: 0;
  }
  .slot-content {
    flex: 1;
    color: #1e3a5f;
  }
  .slot-content.correct { color: #1a7a3a; font-weight: 600; }
  .slot-content.wrong { color: #c0392b; font-weight: 600; }
  button {
    background: #c9a227;
    color: #1e3a5f;
    border: none;
    padding: 12px 28px;
    font-size: 1em;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover { background: #b8901c; transform: translateY(-2px); }
  button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .feedback {
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.95em;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: #e8f5ea; border-left: 4px solid #1a7a3a; color: #145a28; }
  .feedback.bad { background: #fdecea; border-left: 4px solid #c0392b; color: #8b2820; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .quiz-option {
    background: #fff;
    border: 2px solid #e0e6ee;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95em;
  }
  .quiz-option:hover { border-color: #c9a227; background: #fffbe8; }
  .quiz-option.selected { border-color: #1e3a5f; background: #e8eef5; }
  .quiz-option.correct { border-color: #1a7a3a; background: #e8f5ea; }
  .quiz-option.wrong { border-color: #c0392b; background: #fdecea; }
  .final {
    text-align: center;
    padding: 30px 20px;
  }
  .final h2 { color: #1e3a5f; margin-bottom: 12px; }
  .score-circle {
    width: 130px;
    height: 130px;
    margin: 20px auto;
    border-radius: 50%;
    background: #c9a227;
    color: #1e3a5f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2em;
    font-weight: bold;
    box-shadow: 0 6px 20px rgba(201,162,39,0.4);
  }
  .final p { margin: 10px 0; color: #444; line-height: 1.5; }
  .hazard-img {
    background: #fff;
    border: 2px solid #1e3a5f;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    margin-bottom: 16px;
    font-size: 1.1em;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🪤 Mousetrap Assembly Blueprint Review</h1>
    <div class="badge" id="stepBadge">Step 1 of 3</div>
  </header>
  <div class="stage">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:33%"></div></div>
    <div id="content"></div>
  </div>
</div>

<script>
const state = { step: 0, score: 0, maxScore: 0 };

// STEP 1: Order the assembly steps
const assemblySteps = [
  { id: 'a', text: 'Read the blueprint and gather all parts', order: 1 },
  { id: 'b', text: 'Mount the base board on a flat surface', order: 2 },
  { id: 'c', text: 'Attach the spring mechanism to the base', order: 3 },
  { id: 'd', text: 'Install the trigger and catch arm', order: 4 },
  { id: 'e', text: 'Test the trap carefully with a pencil', order: 5 }
];

// STEP 2: Match parts to labels (blueprint reading)
const matchPairs = [
  { part: 'Base Plate', desc: 'Flat wooden platform that holds all components' },
  { part: 'Spring', desc: 'Stores energy to power the snap arm' },
  { part: 'Catch Bar', desc: 'Holds the loaded arm under tension' },
  { part: 'Trigger Pedal', desc: 'Releases the catch when bait is touched' }
];

// STEP 3: Safety quiz
const safetyQuestions = [
  {
    q: 'Before assembling the mousetrap, what is the FIRST safety step?',
    options: [
      'Load the spring as fast as possible',
      'Put on safety glasses and clear your work area',
      'Test the trigger with your finger',
      'Skip the blueprint and start building'
    ],
    correct: 1,
    explain: 'A clear workspace and eye protection prevent injuries from snapping springs and flying parts.'
  },
  {
    q: 'When loading the spring, you should always:',
    options: [
      'Keep fingers behind the snap arm path',
      'Hold the bait pedal with your thumb',
      'Place your hand under the arm',
      'Look closely at the trigger from above'
    ],
    correct: 0,
    explain: 'Keeping fingers out of the snap path is the #1 rule. A loaded spring can release suddenly.'
  },
  {
    q: 'Why does the blueprint show exploded views and part numbers?',
    options: [
      'To make the drawing look fancy',
      'To hide the design from competitors',
      'So every builder assembles parts in the same correct order',
      'Because blueprints must be colorful'
    ],
    correct: 2,
    explain: 'Assembly drawings communicate exact order and orientation so any builder produces the same reliable product.'
  }
];

const content = document.getElementById('content');
const stepBadge = document.getElementById('stepBadge');
const progressFill = document.getElementById('progressFill');

function updateProgress() {
  stepBadge.textContent = `Step ${Math.min(state.step+1, 4)} of 4`;
  progressFill.style.width = ((state.step+1) / 4 * 100) + '%';
}

function renderStep1() {
  state.maxScore += 5;
  const shuffled = [...assemblySteps].sort(() => Math.random() - 0.5);
  content.innerHTML = `
    <div class="step-title">📋 Order the Assembly Steps</div>
    <div class="step-prompt">Drag each step from the left into the correct order on the right. A good blueprint follows a clear sequence!</div>
    <div id="fb1" class="feedback"></div>
    <div class="workspace">
      <div class="panel">
        <h3>Available Steps</h3>
        <div id="pool"></div>
      </div>
      <div class="panel">
        <h3>Correct Build Order</h3>
        <div id="slots"></div>
      </div>
    </div>
    <div class="controls">
      <div style="font-size:0.85em;color:#666;">Drag to reorder. Drop into numbered slots.</div>
      <button id="check1" disabled>Check Order</button>
    </div>
  `;
  const pool = document.getElementById('pool');
  shuffled.forEach(s => {
    const d = document.createElement('div');
    d.className = 'draggable';
    d.draggable = true;
    d.dataset.id = s.id;
    d.dataset.order = s.order;
    d.textContent = s.text;
    pool.appendChild(d);
  });
  const slots = document.getElementById('slots');
  for (let i = 1; i <= 5; i++) {
    const slot = document.createElement('div');
    slot.className = 'drop-slot';
    slot.dataset.position = i;
    slot.innerHTML = `<div class="slot-num">${i}</div><div class="slot-content">Drop step here...</div>`;
    slots.appendChild(slot);
  }
  setupDragDrop();
}

function setupDragDrop() {
  let dragged = null;
  document.querySelectorAll('.draggable').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragged = el;
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      checkReady1();
    });
  });
  document.querySelectorAll('.drop-slot').forEach(slot => {
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('over'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('over');
      if (!dragged) return;
      const existing = slot.querySelector('.draggable');
      const parent = dragged.parentElement;
      if (existing) {
        parent.appendChild(existing);
      }
      const content = slot.querySelector('.slot-content');
      if (content) content.remove();
      slot.appendChild(dragged);
      dragged.classList.remove('dragging');
      checkReady1();
    });
  });
  // pool also acceptss drops
  document.getElementById('pool').addEventListener('dragover', e => e.preventDefault());
  document.getElementById('pool').addEventListener('drop', e => {
    e.preventDefault();
    if (dragged && dragged.parentElement.classList.contains('drop-slot')) {
      const oldSlot = dragged.parentElement;
      document.getElementById('pool').appendChild(dragged);
      const c = document.createElement('div');
      c.className = 'slot-content';
      c.textContent = 'Drop step here...';
      oldSlot.appendChild(c);
    }
  });
  document.getElementById('check1').onclick = check1;
}

function checkReady1() {
  const slots = document.querySelectorAll('.drop-slot');
  let filled = 0;
  slots.forEach(s => { if (s.querySelector('.draggable')) filled++; });
  document.getElementById('check1').disabled = filled !== 5;
}

function check1() {
  const slots = document.querySelectorAll('.drop-slot');
  let correct = 0;
  slots.forEach(s => {
    const pos = parseInt(s.dataset.position);
    const item = s.querySelector('.draggable');
    if (item && parseInt(item.dataset.order) === pos) {
      correct++;
      item.style.borderColor = '#1a7a3a';
      item.style.background = '#e8f5ea';
    } else if (item) {
      item.style.borderColor = '#c0392b';
      item.style.background = '#fdecea';
    }
  });
  state.score += correct;
  const fb = document.getElementById('fb1');
  fb.className = 'feedback show ' + (correct === 5 ? 'good' : 'bad');
  fb.innerHTML = correct === 5
    ? `✅ Perfect! All 5 steps in order. Blueprints exist so every builder follows the same sequence.`
    : `You got ${correct}/5 correct. Remember: gather → mount base → attach spring → install trigger → test carefully.`;
  document.getElementById('check1').disabled = true;
  setTimeout(() => {
    const btn = document.createElement('button');
    btn.textContent = 'Next →';
    btn.onclick = next;
    document.querySelector('.controls').appendChild(btn);
  }, 800);
}

function renderStep2() {
  state.maxScore += 4;
  content.innerHTML = `
    <div class="step-title">🔍 Match Parts to Blueprint Labels</div>
    <div class="step-prompt">A good assembly drawing labels every part. Drag each part name onto its correct description.</div>
    <div id="fb2" class="feedback"></div>
    <div class="workspace">
      <div class="panel">
        <h3>Part Names</h3>
        <div id="pool2"></div>
      </div>
      <div class="panel">
        <h3>Descriptions</h3>
        <div id="slots2"></div>
      </div>
    </div>
    <div class="controls">
      <div style="font-size:0.85em;color:#666;">Match all 4 parts.</div>
      <button id="check2" disabled>Check Matches</button>
    </div>
  `;
  const pool = document.getElementById('pool2');
  const shuffled = [...matchPairs].sort(() => Math.random() - 0.5);
  shuffled.forEach(p => {
    const d = document.createElement('div');
    d.className = 'draggable';
    d.draggable = true;
    d.dataset.part = p.part;
    d.textContent = p.part;
    pool.appendChild(d);
  });
  const slots = document.getElementById('slots2');
  const shuffledDesc = [...matchPairs].sort(() => Math.random() - 0.5);
  shuffledDesc.forEach((p, i) => {
    const slot = document.createElement('div');
    slot.className = 'drop-slot';
    slot.dataset.answer = p.part;
    slot.innerHTML = `<div class="slot-num">${i+1}</div><div class="slot-content" style="flex:1;font-size:0.88em;">${p.desc}</div><div class="drop-target" style="min-width:110px;min-height:30px;border:1px dashed #ccc;border-radius:6px;padding:4px;font-size:0.85em;text-align:center;color:#999;">drop here</div>`;
    slots.appendChild(slot);
  });
  setupDragDrop2();
}

function setupDragDrop2() {
  let dragged = null;
  function refresh() {
    document.querySelectorAll('#pool2 .draggable, #slots2 .draggable').forEach(el => {
      el.draggable = true;
      el.ondragstart = e => { dragged = el; el.classList.add('dragging'); };
      el.ondragend = () => { el.classList.remove('dragging'); checkReady2(); };
    });
  }
  refresh();
  document.querySelectorAll('#slots2 .drop-target').forEach(target => {
    target.ondragover = e => { e.preventDefault(); target.style.borderColor = '#c9a227'; };
    target.ondragleave = () => { target.style.borderColor = '#ccc'; };
    target.ondrop = e => {
      e.preventDefault();
      target.style.borderColor = '#ccc';
      if (!dragged) return;
      const existing = target.querySelector('.draggable');
      if (existing) document.getElementById('pool2').appendChild(existing);
      target.textContent = '';
      target.appendChild(dragged);
      refresh();
      checkReady2();
    };
  });
  document.getElementById('pool2').ondragover = e => e.preventDefault();
  document.getElementById('pool2').ondrop = e => {
    e.preventDefault();
    if (dragged && dragged.parentElement.classList.contains('drop-target')) {
      const oldTarget = dragged.parentElement;
      document.getElementById('pool2').appendChild(dragged);
      oldTarget.textContent = 'drop here';
    }
  };
  document.getElementById('check2').onclick = check2;
}

function checkReady2() {
  const targets = document.querySelectorAll('#slots2 .drop-target');
  let filled = 0;
  targets.forEach(t => { if (t.querySelector('.draggable')) filled++; });
  document.getElementById('check2').disabled = filled !== 4;
}

function check2() {
  const slots = document.querySelectorAll('#slots2 .drop-slot');
  let correct = 0;
  slots.forEach(s => {
    const answer = s.dataset.answer;
    const item = s.querySelector('.draggable');
    if (item && item.dataset.part === answer) {
      correct++;
      item.style.borderColor = '#1a7a3a';
      item.style.background = '#e8f5ea';
    } else if (item) {
      item.style.borderColor = '#c0392b';
      item.style.background = '#fdecea';
    }
  });
  state.score += correct;
  const fb = document.getElementById('fb2');
  fb.className = 'feedback show ' + (correct === 4 ? 'good' : 'bad');
  fb.innerHTML = correct === 4
    ? `✅ Excellent! You read the blueprint like a pro. Every part has a name and a job.`
    : `${correct}/4 matched. Take a moment to study how each named part connects to its function.`;
  document.getElementById('check2').disabled = true;
  setTimeout(() => {
    const btn = document.createElement('button');
    btn.textContent = 'Next →';
    btn.onclick = next;
    document.querySelector('.controls').appendChild(btn);
  }, 800);
}

function renderStep3() {
  state.maxScore += 3;
  state.quizIndex = 0;
  state.quizCorrect = 0;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = safetyQuestions[state.quizIndex];
  content.innerHTML = `
    <div class="step-title">⚠️ Safety Review Quiz (${state.quizIndex+1}/3)</div>
    <div class="step-prompt">${q.q}</div>
    <div id="fb3" class="feedback"></div>
    <div class="quiz-options" id="qopts"></div>
    <div class="controls">
      <div></div>
      <button id="qnext" disabled>Submit</button>
    </div>
  `;
  const opts = document.getElementById('qopts');
  q.options.forEach((opt, i) => {
    const d = document.createElement('div');
    d.className = 'quiz-option';
    d.textContent = opt;
    d.onclick = () => {
      document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
      d.classList.add('selected');
      d.dataset.selected = 'true';
      document.getElementById('qnext').disabled = false;
      state.selected = i;
    };
    opts.appendChild(d);
  });
  document.getElementById('qnext').onclick = submitQuiz;
}

function submitQuiz() {
  const q = safetyQuestions[state.quizIndex];
  const opts = document.querySelectorAll('.quiz-option');
  opts.forEach((o, i) => {
    o.onclick = null;
    if (i === q.correct) o.classList.add('correct');
    else if (i === state.selected) o.classList.add('wrong');
  });
  const isCorrect = state.selected === q.correct;
  if (isCorrect) state.quizCorrect++;
  const fb = document.getElementById('fb3');
  fb.className = 'feedback show ' + (isCorrect ? 'good' : 'bad');
  fb.innerHTML = (isCorrect ? '✅ Correct! ' : '❌ Not quite. ') + q.explain;
  const btn = document.getElementById('qnext');
  btn.textContent = state.quizIndex < safetyQuestions.length - 1 ? 'Next Question →' : 'See Final Score →';
  btn.disabled = false;
  btn.onclick = () => {
    state.quizIndex++;
    if (state.quizIndex < safetyQuestions.length) {
      renderQuizQuestion();
    } else {
      state.score += state.quizCorrect;
      next();
    }
  };
}

function renderFinal() {
  const pct = Math.round(state.score / state.maxScore * 100);
  let msg = '';
  if (pct >= 90) msg = 'Outstanding! You are blueprint-ready and safety-smart. Time to build!';
